# Optional Optuna search. Requires requirements-optional.txt.
# Each search_space entry gives a dotted config key sampled on top of this config.

_base_: pretrain.yaml

paths:
  output_dir: outputs/hpo

hpo:
  study_name: biln-lm
  n_trials: 20
  search_space:
    - key: model.num_hidden_layers
      type: int
      low: 2
      high: 12
    - key: model.num_attention_heads
      type: categorical
      choices: [4, 6, 8, 12]
    - key: model.hidden_size
      type: categorical
      choices: [192, 240, 288, 384, 480, 576, 768]
    - key: model.position_embedding_type
      type: categorical
      choices: [rotary, absolute]
    - key: training.learning_rate
      type: float
      low: 1.0e-5
      high: 1.0e-3
      log: true
    - key: training.per_device_train_batch_size
      type: categorical
      choices: [16, 32, 64]
