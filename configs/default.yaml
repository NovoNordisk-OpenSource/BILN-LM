# Settings shared by every entrypoint. Task configs override subsets of this.

seed: 1

paths:
  # Corpora and downstream CSVs. Points at the original BILN-LM data by default.
  data_dir: data
  output_dir: outputs/run
  monomer_library: null   # null -> the library packaged in biln_lm/data

hardware:
  device: auto            # auto | cpu | cuda | cuda:0 ...

tokenizer:
  kind: monomer           # monomer | bpe
  path: null              # load an existing tokenizer instead of building one
  max_bond_id: 8
  max_rgroup: 3
  include_library_symbols: true
  min_symbol_frequency: 1 # corpus symbols rarer than this are left to [UNK]
  vocab_size: 3000        # bpe only

data:
  files: [biln_db.csv]    # relative to paths.data_dir, or absolute
  column: biln
  max_length: 256
  valid_fraction: 0.1
  max_samples: null
